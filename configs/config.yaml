shortcut:
  - "<fn>"
  - "<num_lock>"
hotkey_mode: "hold"
trigger_mode: "audio"
input_device: 1
model_name: "small.en"
device: "auto"
sample_rate: 16000
channels: 1
max_recording_seconds: 300
clipboard: true
auto_paste: true
type_characters: false
duck_audio: true
duck_volume: 10
audio_trigger_threshold: 0.001
audio_trigger_start_seconds: 0.1
audio_trigger_silence_seconds: 0.6
log_transcripts: false
log_path: "logs/transcripts.log"
